# Started by hand on main: releases the commit it was started on as the
# version VERSION names there, tag vX.Y.Z and a GitHub release whose archives,
# and the crew-actions binary inside each one, carry a signed build-provenance
# attestation. Merging a pull request, a version bump included, publishes
# nothing.
# The release runs in the organization's workflow
# (thatsnotmynameio/github-actions' go-release.yml). A run started on another
# branch is skipped. The run fails when its tag already exists, or when
# GoReleaser finds the tag is not semantic. GoReleaser (.goreleaser.yaml) then
# builds crew-actions for macOS and Linux and publishes the release with the
# archives and checksums.txt, with notes made from the commits since the last
# tag; GitHub creates the tag at the built commit. actions/attest then attests
# every archive and binary GoReleaser built, through GitHub's artifact
# attestations. The attestations are signed by the organization's workflow,
# not this one: verify them with --signer-workflow
# thatsnotmynameio/github-actions/.github/workflows/go-release.yml.
# A run that fails before GoReleaser publishes is started again. One that
# fails after it, the attestation included, leaves a published release and
# its tag: delete both, then start again.
name: Release

on:
  workflow_dispatch:

permissions: {}

# One release at a time; a run never cancels another
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    permissions:
      contents: write # the release and its assets
      id-token: write # the OIDC token Sigstore certifies the attestation with
      attestations: write # stores the attestation
    uses: thatsnotmynameio/github-actions/.github/workflows/go-release.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main
