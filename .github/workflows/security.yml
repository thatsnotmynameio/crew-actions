# Every pull request and each push to main: the security analyses, published
# to GitHub code scanning. The push gives code scanning the analysis of main
# that a pull request's alerts are compared against. CodeQL analyses Go and
# GitHub Actions; Grype scans the repository's dependencies, and dependency
# review checks the dependencies a pull request adds. zizmor, which audits the
# workflows' security, runs here only on a push to main: on a pull request the
# organization's ruleset runs it, as the check "tnmn.io: zizmor".
# No job holds a secret: code scanning accepts an upload from any run that
# the pull_request event started, a fork's included, with the read-only token.
# No paths filter: these checks will be required, and a required check that
# a path filter skips stays pending.
# Each job checks out the pull request's merge commit, which is the commit its
# results are filed under, so configuration files come from the merged tree
# and a change to them applies to the pull request that makes it.
name: Security

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  # CodeQL's advanced setup, with the security-extended suite
  # (.github/codeql/codeql-config.yml). Its alerts do not fail the job. The job
  # fails on a build or analysis error, and then uploads nothing.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    # A pull request's newer run replaces the older one. Each main commit gets
    # a group of its own and is never cancelled.
    concurrency:
      group: ${{ github.workflow }}-codeql-${{ matrix.language }}-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before CodeQL's init, so its extractor uses this Go.
      - if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      # The Go extractor sees only the go commands this step runs. go build
      # extracts no test file, and the extract_tests option does not apply to a
      # traced build: only a traced go test does, and only with build flags,
      # since the extractor hands them to go list (-run makes it fail and skip
      # every test). So the step compiles the test binaries with go test -c,
      # which runs no test. go test -c -o dir/ names a binary after its
      # package's last path element (cmd/crew and internal/crew are both
      # crew.test), so packages that share one go in separate batches.
      - name: build
        if: matrix.language == 'go'
        shell: bash
        run: |
          out="$RUNNER_TEMP/codeql-tests"
          mkdir -p "$out"
          go build ./...
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... |
            awk -F/ 'NF { print ++seen[$NF], $0 }' > "$out/packages"
          while read -r batch; do
            mapfile -t packages < <(awk -v batch="$batch" '$1 == batch { print $2 }' "$out/packages")
            go test -c -o "$out/$batch/" "${packages[@]}"
          done < <(cut -d' ' -f1 "$out/packages" | sort -un)
      - id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-results
      # A database without the tests would upload as a
      # complete analysis and mark their alerts fixed: a failed build of the
      # tests does not fail the extraction. So the job checks the Go database's
      # source archive, which lists every file extracted, before it uploads.
      - name: extracted files
        if: matrix.language == 'go'
        shell: bash
        env:
          DB_LOCATIONS: ${{ steps.analyze.outputs.db-locations }}
        run: |
          database="$(jq -r .go <<< "$DB_LOCATIONS")"
          unzip -Z1 "$database/src.zip" | awk -v root="${GITHUB_WORKSPACE#/}/" '
            index($0, root) != 1 || !/\.go$/ { next }
            { path = substr($0, length(root) + 1) }
            path ~ /_test\.go$/ { tests++ }
            END {
              printf "test files: %d\n", tests
              if (!tests) {
                print "::error::The Go database is missing the test files."
                exit 1
              }
            }'
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}

  # Vulnerable dependencies and malicious packages in every manifest of the
  # checkout, with the ignore rules of .grype.yaml, through Anchore's scan
  # action. Its alerts do not fail the job: code scanning reports the ones a
  # pull request adds. The job fails on a tool error, and then uploads
  # nothing.
  # The job's name and the category "grype" are contracts: the checks ruleset
  # requires the job by name, and the scans of main upload under the same
  # category. A renamed job leaves a required check pending forever, and a
  # renamed category leaves its old alerts open on main.
  grype:
    name: grype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    # A pull request's newer run replaces the older one. Each main commit gets
    # a group of its own and is never cancelled.
    concurrency:
      group: ${{ github.workflow }}-grype-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fail-build false: grype exits non-zero only on an error. No
      # only-fixed, so malware, which has no fixed version, stays in the
      # results. A database grype cannot check for updates, or older than its
      # maximum age, is an error.
      - id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        env:
          GRYPE_DB_REQUIRE_UPDATE_CHECK: "true"
          GRYPE_DB_VALIDATE_AGE: "true"
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
        with:
          path: "."
          config: .grype.yaml
          fail-build: false
          output-format: sarif
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype

  # The dependencies a pull request adds, through GitHub's dependency review:
  # a license off the allowlist below, or a known vulnerability, fails the
  # job. A push has nothing to compare, so it runs only on pull requests.
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-dependency-review-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The licenses a dependency may have. Today's dependency graph holds
          # MIT and BSD-3-Clause, Apache-2.0 (go.yaml.in/yaml/v3, with MIT)
          # and LicenseRef-scancode-google-patent-license-golang (Go's
          # golang.org/x modules, with BSD-3-Clause). MIT-0, BSD-2-Clause,
          # ISC and 0BSD are permissive licenses that ask no more of crew's
          # MIT license than a notice. No copyleft license is on the list:
          # adding one, or any other license, is a decision made here.
          allow-licenses: MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, 0BSD, LicenseRef-scancode-google-patent-license-golang
          # Every new vulnerability, whatever its severity and scope.
          fail-on-severity: low
          fail-on-scopes: runtime, development, unknown
          # A comment would need pull-requests: write.
          comment-summary-in-pr: never

  # zizmor's analysis of main, through the organization's workflow
  # (thatsnotmynameio/github-actions' zizmor.yml) under the category "zizmor":
  # code scanning compares each pull request's zizmor alerts with it. On a pull
  # request the organization's ruleset runs the same workflow, as the check
  # "tnmn.io: zizmor", with .github/zizmor.yml from the base commit: a rule
  # turned off there applies once it merges, never to the pull request that
  # does it. The workflow audits the workflows, the composite actions and
  # Dependabot's configuration with zizmor's online audits, and never fails on
  # a finding.
  # The category "zizmor" is a contract, as for grype above.
  zizmor:
    name: zizmor
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    concurrency:
      group: ${{ github.workflow }}-zizmor-${{ github.sha }}
      cancel-in-progress: false
    uses: thatsnotmynameio/github-actions/.github/workflows/zizmor.yml@2ebbe7f8128610a86d4561b8cf5f8ec8b69f24f3 # main
