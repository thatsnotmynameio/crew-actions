# Every pull request and each push to main: the security analyses, published
# to GitHub code scanning. The push gives code scanning the analysis of main
# that a pull request's alerts are compared against. CodeQL analyses GitHub
# Actions here on every run. CodeQL's analysis of Go, Grype, which scans the
# repository's dependencies, and zizmor, which audits the workflows' security,
# run here only on a push to main, through the organization's workflows: on a
# pull request the organization's rulesets run them, as the checks
# "tnmn.io: codeql (go)", "tnmn.io: grype" and "tnmn.io: zizmor", and
# "tnmn.io: dependency-review" checks the dependencies a pull request adds.
# No job holds a secret: code scanning accepts an upload from any run that
# the pull_request event started, a fork's included, with the read-only token.
# No paths filter: these checks will be required, and a required check that
# a path filter skips stays pending.
# The codeql (actions) job checks out a pull request's head commit and files
# its results under it, so its configuration file comes from the pull request
# and a change to it applies to the pull request that makes it. The
# organization's workflows read theirs from the base commit.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Daily as well: grype's analysis of main then shows an advisory published
  # since the last push within a day, and a pull request stops seeing it as
  # one it adds.
  schedule:
    - cron: "41 5 * * *"

permissions: {}

jobs:
  # CodeQL's advanced setup for the workflows, with the security-extended
  # suite (.github/codeql/codeql-config.yml). Its alerts do not fail the job.
  # The job fails on an analysis error, and then uploads nothing.
  codeql:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    # A pull request's newer run replaces the older one. Each main commit gets
    # a group of its own and is never cancelled.
    concurrency:
      group: ${{ github.workflow }}-codeql-${{ matrix.language }}-${{ github.event_name == 'push' && github.sha || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      # On a pull request, its head commit, not the test merge commit: GitHub
      # makes a new merge commit when it rechecks the pull request (a ruleset
      # change or a merge attempt), and code scanning then waits for results
      # on the new one. The head commit stays until the next push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-results
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
          # On a pull request, filed under its head commit; elsewhere, under the
          # run's ref and commit.
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
          sha: ${{ github.event.pull_request.head.sha || '' }}

  # CodeQL's analysis of the Go module, test files included, on each push and
  # daily, through the organization's workflow
  # (thatsnotmynameio/github-actions' codeql-go.yml) under the category
  # /language:go, with the security-extended suite of
  # .github/codeql/codeql-config.yml. On a pull request the organization's
  # ruleset runs the same workflow, as the check "tnmn.io: codeql (go)", with
  # .github/codeql/codeql-config.yml from the base commit: a change to it
  # applies to Go once it merges. Its alerts do not fail the job; a build or
  # analysis error does, and then it uploads nothing.
  # The category /language:go is a contract, as for grype below: it is the
  # one the Go analysis has always used, so main's alerts carry over.
  codeql-go:
    name: codeql (go)
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    concurrency:
      group: ${{ github.workflow }}-codeql-go-${{ github.sha }}
      cancel-in-progress: false
    uses: thatsnotmynameio/github-actions/.github/workflows/codeql-go.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main

  # Grype's analysis of main, on each push and daily, through the
  # organization's workflow
  # (thatsnotmynameio/github-actions' grype.yml) under the category "grype":
  # vulnerable dependencies and malicious packages in every manifest, with the
  # ignore rules of .grype.yaml. On a pull request the organization's ruleset
  # runs the same workflow, as the check "tnmn.io: grype", with .grype.yaml
  # from the base commit. It never fails on a finding.
  # The category "grype" is a contract: a renamed category leaves its old
  # alerts open on main.
  grype:
    name: grype
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    concurrency:
      group: ${{ github.workflow }}-grype-${{ github.sha }}
      cancel-in-progress: false
    uses: thatsnotmynameio/github-actions/.github/workflows/grype.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main

  # zizmor's analysis of main, through the organization's workflow
  # (thatsnotmynameio/github-actions' zizmor.yml) under the category "zizmor":
  # code scanning compares each pull request's zizmor alerts with it. On a pull
  # request the organization's ruleset runs the same workflow, as the check
  # "tnmn.io: zizmor", with .github/zizmor.yml from the base commit: a rule
  # turned off there applies once it merges, never to the pull request that
  # does it. The workflow audits the workflows, the composite actions and
  # Dependabot's configuration with zizmor's online audits, and never fails on
  # a finding.
  # The category "zizmor" is a contract, as for grype above.
  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    concurrency:
      group: ${{ github.workflow }}-zizmor-${{ github.sha }}
      cancel-in-progress: false
    uses: thatsnotmynameio/github-actions/.github/workflows/zizmor.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main
