# Every pull request and each push to main: the security analyses, published
# to GitHub code scanning. The push gives code scanning the analysis of main
# that a pull request's alerts are compared against. CodeQL analyses Go and
# GitHub Actions, through the organization's workflow (thatsnotmynameio/
# github-actions' codeql.yml), here on every run: GitHub does not allow
# CodeQL in a workflow a ruleset requires. Grype, which scans the repository's dependencies, and zizmor,
# which audits the workflows' security, run here only on a push to main,
# through the organization's workflows: on a pull request the organization's
# rulesets run them, as the checks "tnmn.io: grype" and "tnmn.io: zizmor", and
# "tnmn.io: dependency-review" checks the dependencies a pull request adds.
# No job holds a secret: code scanning accepts an upload from any run that
# the pull_request event started, a fork's included, with the read-only token.
# No paths filter: these checks will be required, and a required check that
# a path filter skips stays pending.
# CodeQL checks out a pull request's head commit and files its results under
# it, with .github/codeql/codeql-config.yml from the base commit: a change to
# it applies once it merges.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # Daily as well: grype's analysis of main then shows an advisory published
  # since the last push within a day, and a pull request stops seeing it as
  # one it adds.
  schedule:
    - cron: "41 5 * * *"

permissions: {}

jobs:
  # CodeQL's advanced setup, with the security-extended suite
  # (.github/codeql/codeql-config.yml), through the organization's workflow:
  # the checks "codeql / codeql (go)" and "codeql / codeql (actions)". Its
  # alerts do not fail the jobs. A job fails on a build or analysis error,
  # and then uploads nothing.
  # The job's id, codeql, is a contract, as are the categories /language:go
  # and /language:actions: code scanning tells analyses apart by them, so a
  # renamed job leaves its old alerts open on main.
  codeql:
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    uses: thatsnotmynameio/github-actions/.github/workflows/codeql.yml@763172b92e1b554651b18ac28545eb9712eaa820 # main

  # Grype's analysis of main, on each push and daily, through the
  # organization's workflow
  # (thatsnotmynameio/github-actions' grype.yml) under the category "grype":
  # vulnerable dependencies and malicious packages in every manifest, with the
  # ignore rules of .grype.yaml. On a pull request the organization's ruleset
  # runs the same workflow, as the check "tnmn.io: grype", with .grype.yaml
  # from the base commit. It never fails on a finding.
  # The category "grype" is a contract: a renamed category leaves its old
  # alerts open on main.
  grype:
    name: grype
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    concurrency:
      group: ${{ github.workflow }}-grype-${{ github.sha }}
      cancel-in-progress: false
    uses: thatsnotmynameio/github-actions/.github/workflows/grype.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main

  # zizmor's analysis of main, through the organization's workflow
  # (thatsnotmynameio/github-actions' zizmor.yml) under the category "zizmor":
  # code scanning compares each pull request's zizmor alerts with it. On a pull
  # request the organization's ruleset runs the same workflow, as the check
  # "tnmn.io: zizmor", with .github/zizmor.yml from the base commit: a rule
  # turned off there applies once it merges, never to the pull request that
  # does it. The workflow audits the workflows, the composite actions and
  # Dependabot's configuration with zizmor's online audits, and never fails on
  # a finding.
  # The category "zizmor" is a contract, as for grype above.
  zizmor:
    name: zizmor
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      security-events: write # uploads the results to code scanning
    concurrency:
      group: ${{ github.workflow }}-zizmor-${{ github.sha }}
      cancel-in-progress: false
    uses: thatsnotmynameio/github-actions/.github/workflows/zizmor.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main
