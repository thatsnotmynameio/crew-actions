# Each push to main: the Go module's checks, through the organization's
# workflow (thatsnotmynameio/github-actions' go.yml). On Linux and macOS it
# checks that go mod tidy changes nothing, then runs gofmt, vet, golangci-lint
# (including the layering rules in .golangci.yml), the tests with the race
# detector and coverage, and govulncheck. Linux alone starts the store's test
# database, the Compose service .github/go.yml names, so on macOS the store's
# tests skip; Linux also checks the coverage floor of .github/go.yml and
# uploads lint's findings to code scanning. A snapshot of the release build
# from .goreleaser.yaml follows. The push gives code scanning the analysis of
# main that a pull request's golangci-lint alerts are compared against.
# On a pull request the organization's ruleset runs the same workflow, as the
# check "tnmn.io: go", with .github/go.yml and .golangci.yml from the base
# commit: a change to them applies once it merges. actionlint runs on every
# pull request the same way, as the check "tnmn.io: actionlint".
name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Each commit gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  go:
    name: go
    permissions:
      contents: read
      security-events: write # uploads golangci-lint's findings to code scanning
    uses: thatsnotmynameio/github-actions/.github/workflows/go.yml@e72ce0d0a5da8284edb9aea1cdff812e06c80b54 # main
