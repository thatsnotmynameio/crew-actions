# Weekly pull requests for new versions, one per ecosystem: the actions
# (pinned by SHA), and crew's Go module with its tools (go.mod's tool
# directive). A version is proposed only
# once it is 7 days old, so a compromised release has time to be pulled.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      go:
        patterns: ["*"]
    # modernc.org/libc moves only with modernc.org/sqlite: the driver needs
    # exactly the libc its go.mod names, which a driver bump raises.
    ignore:
      - dependency-name: "modernc.org/libc"
