# CodeQL's configuration. security.yml's codeql (actions) job reads it from
# the pull request's own tree, so for GitHub Actions a change here applies to
# that pull request's run. The organization's check "tnmn.io: codeql (go)"
# reads it from the pull request's base commit, so for Go a change applies
# once it merges.
# security-extended, not security-and-quality: golangci-lint already owns the
# quality findings, with every linter on.
name: crew

queries:
  - uses: security-extended
