# golangci-lint v2 (v2.14.0 in CI; locally: go run
# github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run).
# depguard enforces the import rules of docs/architecture.md section 4 (D7);
# each rule's desc names the decision it comes from.
version: "2"

linters:
  # Every linter is on unless it is listed under disable with the reason it
  # is off: a rule earns its place by finding things we would fix. The version
  # is pinned (v2.14.0), so a release cannot switch new linters on unseen.
  default: all
  disable:
    # cyclop measures the same cyclomatic complexity, matched to Lizard's CCN.
    - gocyclo
    # Whitespace style (blank lines around blocks and before returns). gofmt
    # already owns layout; these findings never made the code clearer.
    - wsl
    - wsl_v5
    - nlreturn
    # Go's zero values are deliberate: requiring every struct field to be set
    # would undo them and add noise to every literal.
    - exhaustruct
    - exhaustruct_v5
    # Short names in short scopes are idiomatic Go (i, err, ok, tc).
    - varnamelen
    # `if err := f(); err != nil` scopes err to its check, the idiomatic form.
    - noinlineerr
    # Tests isolate git with t.Setenv (GIT_CONFIG_GLOBAL), which t.Parallel
    # forbids, and the whole suite runs in seconds.
    - paralleltest
    # Ports and adapters: factories and adapters return port interfaces
    # (port.Tracker, port.Session, core.Input) by design.
    - ireturn
    # Struct tags mirror formats crew does not own: Claude's stream-json, gh's
    # JSON and the snake_case keys of .crew/config.yaml.
    - tagliatelle
    # Tests are white-box on purpose: the core's reducer and the adapters'
    # scripted runners are tested from inside their packages.
    - testpackage
    # Errors carry their context where they are made; sentinels exist only
    # where a caller branches on them (internal/port). Wrapping every message
    # in a static error adds a type nobody checks.
    - err113
    # crew is English-only and shows the boss times in their local zone on
    # purpose; this linter is for internationalised code.
    - gosmopolitan
    # Deprecated in favour of gomodguard_v2, which default: all already runs.
    - gomodguard
  settings:
    revive:
      enable-default-rules: true
      rules:
        - name: argument-limit
          arguments: [8]
        # Non-comment, non-blank lines.
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: true
              skipBlankLines: true
    exhaustive:
      # A switch with a default branch already handles every other value.
      default-signifies-exhaustive: true
    gochecksumtype:
      # A switch over a sealed interface (//sumtype:decl) names every case:
      # a default branch does not cover the ones it leaves out.
      default-signifies-exhaustive: false
      # A case may name a sealed sub-family, such as the run inputs among
      # the inputs, and covers every variant of it.
      include-shared-interfaces: true
    wrapcheck:
      # crew's own packages already wrap with context where the error is made;
      # only errors from third-party packages need context added here.
      ignore-package-globs:
        - github.com/thatsnotmynameio/crew/*
    dupl:
      # Tokens a repeated fragment must reach to count as duplication.
      threshold: 100
    cyclop:
      max-complexity: 15
    gocognit:
      min-complexity: 15
    funlen:
      # Non-comment lines, not statements.
      lines: 50
      statements: -1
      ignore-comments: true
    nestif:
      min-complexity: 4
    lll:
      line-length: 120
    nolintlint:
      require-explanation: true
      require-specific: true
    depguard:
      rules:
        # depguard compares an import only with the nearest entry sorted
        # before it, so no entry here is a prefix of another in its list. A
        # trailing $ matches one package exactly; a package whose path starts
        # another's (proc and protocol, crew and crew-actions) is written as
        # <path>$ plus <path>/.
        pure:
          files:
            - "**/internal/spec/**"
            - "**/internal/model/**"
            - "**/internal/scheduler/**"
            - "!$test"
          deny:
            - pkg: os
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: net$
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: net/http
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: net/rpc
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: net/smtp
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: syscall
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: database/sql
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: io/ioutil
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: log
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/engine
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/store
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/transport
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/api
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/source
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/runner
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/telemetry
              desc: spec, model and scheduler open no span and import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/proc$
              desc: spec, model and scheduler import nothing that does I/O (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/proc/
              desc: spec, model and scheduler import nothing that does I/O (D7)
        scheduler-users:
          files:
            - "!**/internal/engine/**"
            - "!**/internal/scheduler/**"
          deny:
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/scheduler
              desc: only engine imports scheduler (D7)
        runner:
          files:
            - "**/internal/runner/**"
          deny:
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/engine
              desc: runner imports protocol, never engine (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/scheduler
              desc: runner imports protocol, never scheduler (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/store
              desc: runner imports protocol, never store (D7)
        engine:
          files:
            - "**/internal/engine/**"
          deny:
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/transport
              desc: engine imports no transport (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/runner/backend
              desc: engine imports no backend (D7)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/source
              desc: engine imports no source (D7)
        postgres-users:
          files:
            - "!**/internal/store/postgres/**"
          deny:
            - pkg: github.com/jackc/pgx
              desc: only store/postgres imports pgx (D7, D9)
            - pkg: github.com/pressly/goose
              desc: only store/postgres imports goose (D7, D10)
            - pkg: github.com/thatsnotmynameio/crew-actions/internal/store/postgres/
              desc: only store/postgres imports the code sqlc generates (D7, D9)
        connect-users:
          files:
            - "!**/internal/transport/connect/**"
          deny:
            - pkg: connectrpc.com/connect
              desc: only transport/connect imports connect-go (D7, D12)
        telemetry-users:
          files:
            - "!**/internal/telemetry/**"
            - "!**/cmd/crew-actions/**"
          deny:
            - pkg: go.opentelemetry.io
              desc: only telemetry imports OpenTelemetry (D7, D13)
        sdk-setup:
          files:
            - "!**/cmd/crew-actions/**"
          deny:
            - pkg: go.opentelemetry.io/otel/exporters
              desc: only cmd/crew-actions sets up the OpenTelemetry SDK and its exporters (D7, D14)
            - pkg: go.opentelemetry.io/contrib/exporters
              desc: only cmd/crew-actions sets up the OpenTelemetry SDK and its exporters (D7, D14)
        crew:
          files:
            - "$all"
          deny:
            - pkg: github.com/thatsnotmynameio/crew$
              desc: crew actions and crew never import each other (D1)
            - pkg: github.com/thatsnotmynameio/crew/
              desc: crew actions and crew never import each other (D1)

  exclusions:
    presets:
      # Only known false positives: unchecked Close/Print-style errors in the
      # standard library. (common-false-positives is left out: it turns gosec's
      # subprocess and file-path rules off everywhere, not only where a
      # finding is justified.)
      - std-error-handling
    rules:
      # Tests repeat literal inputs and expectations so each case reads alone.
      - path: _test\.go
        linters: [goconst]
      # Test fixtures are package-level values shared by the cases of a file.
      - path: _test\.go
        linters: [gochecknoglobals]
      # Table-driven tests repeat their case shape on purpose.
      - path: _test\.go
        linters: [dupl]
      # Tests read fixtures from testdata, run git in temporary repositories
      # and write files in t.TempDir(): paths and commands come from the test.
      - path: _test\.go
        linters: [gosec]
        text: "G(204|304|306)"

formatters:
  enable:
    - gofmt
