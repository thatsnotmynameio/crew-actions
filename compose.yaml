# Two PostgreSQL 18 servers, apart because the tests empty tables and create
# and drop databases. The project name is fixed so every worktree reaches the
# same running servers.
#
# postgres is the engine's database for a run by hand: `docker compose up
# --wait postgres`, then start the engine with
#   CREW_ACTIONS_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5434/crew_actions?sslmode=disable
# Its data sits in a named volume, so builds outlive a restart.
#
# test-postgres is for the tests: `docker compose up --wait test-postgres`,
# then point them at it with
#   CREW_ACTIONS_TEST_DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/crew_actions_test?sslmode=disable
# Its data sits on a tmpfs: each start is a clean server.
name: crew-actions

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crew_actions
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    # Over TCP: while the image initialises a new cluster, its temporary
    # server listens on the Unix socket only.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "crew_actions"]
      interval: 1s
      timeout: 5s
      retries: 30

  test-postgres:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crew_actions_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    # Over TCP: while the image initialises a new cluster, its temporary
    # server listens on the Unix socket only.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "crew_actions_test"]
      interval: 1s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
